name: release-package

on:
  pull_request:
    paths:
      - 'package.json'
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/release-package.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Public safety
        run: node scripts/public-safety-scan.mjs

      - name: Clean-install release smoke
        run: npm run release:smoke

      - name: Build release artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: rrulero-${{ github.ref_name }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
